[common]
version = "2.4"

; Kein fester COM-Port: PlatformIO sucht sich den Leser selbst. Ein hart
; eingetragener Port scheitert auf jedem anderen Rechner als dem des Autors —
; und das Projekt soll nachgebaut werden. Wer mehrere Boards gleichzeitig
; angesteckt hat, übergibt den Port beim Aufruf:
;   pio run -t upload --upload-port /dev/ttyUSB0
;   pio run -t upload --upload-port COM9
; oder trägt ihn dauerhaft in eine nicht versionierte platformio_local.ini ein.

[env:esp32]
platform = espressif32
framework = arduino
board = esp32dev
lib_deps =
	miguelbalboa/MFRC522@^1.4.10
	https://github.com/tzapu/WiFiManager.git
    https://github.com/adafruit/Adafruit-GFX-Library.git
    https://github.com/adafruit/Adafruit_SSD1306.git
	bblanchon/ArduinoJson@^6.19.4
	suhasbhatj/EasyTimer@^2.3.0

build_flags =
	-D CODE_VERSION=${common.version}
upload_speed = 921600
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder
