[common]
version = 2.5

; Kein fester COM-Port: PlatformIO sucht sich den Leser selbst. Ein hart
; eingetragener Port scheitert auf jedem anderen Rechner als dem des Autors —
; und das Projekt soll nachgebaut werden. Wer mehrere Boards gleichzeitig
; angesteckt hat, übergibt den Port beim Aufruf:
;   pio run -e esp32 -t upload --upload-port /dev/ttyUSB0
;   pio run -e t-display -t upload --upload-port COM9
; oder trägt ihn dauerhaft in eine nicht versionierte platformio_local.ini ein.

; Was alle Aufbauten teilen. Jede Umgebung unten ist ein Board.
[env]
platform = espressif32
framework = arduino
lib_deps =
	miguelbalboa/MFRC522@^1.4.10
	adafruit/Adafruit PN532@^1.3.3
	https://github.com/tzapu/WiFiManager.git
	https://github.com/adafruit/Adafruit-GFX-Library.git
	bblanchon/ArduinoJson@^6.19.4
	suhasbhatj/EasyTimer@^2.3.0
build_flags =
	'-D CODE_VERSION="${common.version}"'
upload_speed = 921600
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder

; Kartenleser: die Firmware sucht beim Start selbst, was antwortet — erst ein
; PN532 per UART (DIP-Schalter auf HSU), dann ein RC522 per SPI.

; Ursprünglicher Aufbau: ESP32-DevKit, SSD1306-OLED (I2C 21/22),
; RC522 an VSPI (SCK 18, MISO 19, MOSI 23, SDA 5, RST 15)
; oder PN532 an Serial2 (ESP-RX 16 ← TXD, ESP-TX 17 → RXD).
[env:esp32]
board = esp32dev
lib_deps =
	${env.lib_deps}
	https://github.com/adafruit/Adafruit_SSD1306.git

; LilyGO T-Display (V1.1): ESP32 mit eingebautem 1,14"-Farbdisplay (ST7789,
; 135×240). Das Display belegt 4, 5, 16, 18, 19 und 23 — die Leser kommen
; deshalb an freie Pins der Stiftleiste:
;   PN532 (UART): ESP-RX 21 ← TXD · ESP-TX 22 → RXD · VCC · GND
;   RC522 (SPI):  SCK 25 · MISO 27 · MOSI 26 · SDA 33 · RST 32 · 3V3 · GND
[env:t-display]
board = lilygo-t-display
lib_deps =
	${env.lib_deps}
	https://github.com/adafruit/Adafruit-ST7735-Library.git
build_flags =
	${env.build_flags}
	-D SCREEN_ST7789
	-D RFID_SCK=25
	-D RFID_MISO=27
	-D RFID_MOSI=26
	-D RFID_SS=33
	-D RFID_RST=32
	-D PN532_RX=21
	-D PN532_TX=22
