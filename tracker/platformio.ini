; Firmware für LilyGO T-A7670 / T-SIM7600 als Traktor-Tracker mit WLAN-Hotspot.
; Braucht Arduino-Core 3.x (PPP-Bibliothek, NAPT) — der kommt über pioarduino,
; das offizielle espressif32-Paket von PlatformIO liefert nur Core 2.x.

[env:tracker]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
framework = arduino
board = esp32dev
board_build.partitions = min_spiffs.csv
build_flags =
	-D CORE_DEBUG_LEVEL=3
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
